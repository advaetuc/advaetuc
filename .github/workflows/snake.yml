name: GitHub Snake Game

on:
  # Schedule the workflow to run daily at midnight UTC
  schedule:
    - cron: "0 0 * * *"

  # Allow manual triggering of the workflow
  workflow_dispatch:

  # Trigger the workflow on pushes to the main branch
  #push:
    #branches:
      #- main

# THIS IS THE CRUCIAL FIX: Grants the bot permission to push to the output branch
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Generate the snake animations
      - name: Generate GitHub Contributions Snake Animations
        uses: Platane/snk@v3
        with:
          # GitHub username to generate the animation for
          github_user_name: ${{ github.repository_owner }}

          # Define the output files and their configurations
          outputs: |
            dist/github-snake.svg?color_snake=#475569&color_dots=#f8fafc,#e2e8f0,#cbd5e1,#94a3b8,#64748b
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#f8fafc&color_dots=#1e293b,#475569,#94a3b8,#cbd5e1,#f8fafc
            dist/ocean.gif?color_snake=#334155&color_dots=#ffffff,#f1f5f9,#e2e8f0,#cbd5e1,#94a3b8

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Deploy the generated files to the 'output' branch
      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          # Optionally, you can set a custom commit message
          commit_message: "Update snake animation [skip ci]"
